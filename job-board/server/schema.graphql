type Query {
  jobs: [Job]
  company: Company
}

"""
Represnts job posted to our board
"""
type Job {
  id: ID!
  title: String!
  """
  The __date__ when the job was published, in ISO-8601 format.
  """
  date: String!
  description: String
  company: Company!
}

type Company {
  id: ID!
  name: String!
  description: String
}
